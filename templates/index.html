<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Momentum Radar</title><link rel="manifest" href="/manifest.json"><style>*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}body{background:#080a0f;color:#F0F4F8;display:flex;justify-content:center;min-height:100vh}.frame{width:100%;max-width:480px;padding:16px}.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.btn{background:#111827;color:#38ef7d;border:1px solid #38ef7d55;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700}.add{display:flex;gap:8px;margin-bottom:14px}.in{flex:1;background:#161b22;color:#FFF;border:1px solid #ffffff22;border-radius:6px;padding:8px;font-size:12px;text-transform:uppercase}.abtn{background:#00f2fe;color:#000;border:none;padding:8px 12px;border-radius:6px;font-size:11px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.card{background:#161b22;border-radius:8px;padding:10px;border:1px solid #ffffff11;cursor:pointer}.card.act{border-color:#00f2fe}.ctop{display:flex;justify-content:space-between;font-weight:700}.cprc{color:#00f2fe;font-size:12px;margin-top:2px}.detail{background:#161b22;border-radius:12px;padding:14px;border:1px solid #ffffff15}.dhdr{display:flex;justify-content:space-between;margin-bottom:12px}.txt{width:100%;background:#0d1117;color:#FFF;border:1px solid #ffffff22;border-radius:6px;padding:8px;font-size:11px;min-height:50px;margin-top:8px}</style></head>
<body><div class="frame"><div class="hdr"><h2>MOMENTUM RADAR</h2><button class="btn" onclick="loadData()">🔄 REFRESH</button></div><div class="add"><input type="text" id="nin" class="in" placeholder="Ticker..."><button class="abtn" onclick="addT()">+ Add</button></div><div class="grid" id="mgrid"></div><div class="detail"><div class="dhdr"><div><h3 id="stitle">-</h3><div id="sprc" style="color:#00f2fe;font-size:18px">$0.00</div></div><div id="sig">🟢 LONG</div></div><textarea class="txt" id="note" placeholder="Notiz..." oninput="saveN()"></textarea></div></div>
<script>
let tkrs=JSON.parse(localStorage.getItem('t'))||["AAPL","TSLA","NVDA","BTC"], sData=[], sel=tkrs[0], notes=JSON.parse(localStorage.getItem('n')||'{}');
async function loadData(){
try{let r=await fetch('/api/stocks/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tickers:tkrs})});sData=(await r.json()).data;}catch(e){}render();}
function addT(){let v=document.getElementById('nin').value.trim().toUpperCase();if(v&&!tkrs.includes(v)){tkrs.push(val=v);localStorage.setItem('t',JSON.stringify(tkrs));loadData();}}
function render(){let g=document.getElementById('mgrid');g.innerHTML='';sData.forEach(s=>{g.innerHTML+=`<div class="card ${s.ticker===sel?'act':''}" onclick="sel='${s.ticker}';render()"><div class="ctop"><span>${s.ticker}</span></div><div class="cprc">$${s.price}</div><div style="font-size:10px;color:${s.signal==='LONG'?'#00e676':'#ff5252'}">${s.signal} (${s.momentum3m})</div></div>`;});
let a=sData.find(s=>s.ticker===sel)||sData[0];if(!a)return;document.getElementById('stitle').innerText=a.name;document.getElementById('sprc').innerText='$'+a.price;document.getElementById('sig').innerText=a.signal;document.getElementById('note').value=notes[a.ticker]||'';}
function saveN(){notes[sel]=document.getElementById('note').value;localStorage.setItem('n',JSON.stringify(notes));}
window.onload=loadData;if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
